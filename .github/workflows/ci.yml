name: CI

on:
  pull_request:
  push:
    branches:
      - Refactory

permissions:
  contents: read

# Every action is pinned to a full commit SHA, with its release in a comment: a moved tag
# cannot change what runs here. SHAs read with `git ls-remote --tags` from each action's
# repository on github.com (October 2026); Dependabot (.github/dependabot.yml) proposes updates.

jobs:
  static:
    name: Architecture, PHPCS, PHPStan (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.4']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - uses: ramsey/composer-install@a8d0d959dab41457692a5e2041bd9b757a119e3f # 3.2.1

      - run: composer architecture
      - run: composer lint
      - run: composer analyse

  js:
    name: Admin assets (lint and build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # https://github.com/actions/setup-node/releases
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npm run lint:js
      - run: npm run build

  test:
    name: PHPUnit (WordPress ${{ matrix.wp }}, PHP ${{ matrix.php }}${{ matrix.multisite && ', multisite' || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The declared minimum (Requires at least: 7.0, Requires PHP: 8.0): an API added in 7.1 fails here.
          - php: '8.0'
            wp: '7.0.7'
            multisite: false
          - php: '8.0'
            wp: '7.1.0'
            multisite: false
          - php: '8.4'
            wp: '7.1.0'
            multisite: false
          - php: '8.4'
            wp: '7.1.0'
            multisite: true
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, intl, mbstring, mysqli, xml
          coverage: none

      - uses: ramsey/composer-install@a8d0d959dab41457692a5e2041bd9b757a119e3f # 3.2.1

      - name: Install the WordPress test suite
        run: tools/install-wp-tests.sh wordpress_test root '' 127.0.0.1 ${{ matrix.wp }}

      - name: Run tests
        env:
          WP_TESTS_DIR: /tmp/wordpress-develop/tests/phpunit
          WP_MULTISITE: ${{ matrix.multisite && '1' || '' }}
        run: composer test -- --testdox

  plugin-check:
    name: Plugin Check (distributable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm

      - name: Build the distributable
        run: |
          tools/build-dist.sh
          mkdir -p dist-extracted
          unzip -q .dist/easyrankly.zip -d dist-extracted
          test -f dist-extracted/easyrankly/easyrankly.php
          test -f dist-extracted/easyrankly/build/editor.js
          test ! -e dist-extracted/easyrankly/assets/src
          test ! -e dist-extracted/easyrankly/tests
          test ! -e dist-extracted/easyrankly/tools

      - uses: wordpress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e # v1.1.9
        with:
          build-dir: ./dist-extracted/easyrankly
          slug: easyrankly
          ignore-warnings: true
          # The only eval allowed by CLAUDE.md ("Custom code"); composer architecture keeps it in this file.
          exclude-files: src/CustomCode/PhpRunner.php
          categories: |
            plugin_repo
